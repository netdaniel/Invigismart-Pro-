<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Invigismart Pro">
  <title>Invigismart Pro</title>
  <defs>
    <linearGradient id="isShield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4aa8f2"/>
      <stop offset="0.45" stop-color="#1d6fd8"/>
      <stop offset="1" stop-color="#17a95f"/>
    </linearGradient>
    <linearGradient id="isCheck" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#19a85b"/>
      <stop offset="1" stop-color="#34c375"/>
    </linearGradient>
  </defs>

  <!-- Shield -->
  <path d="M10.5 4 H53.5 C56.7 4 59 6.3 59 9.5 V28 C59 41.5 48.8 52 32 60 C15.2 52 5 41.5 5 28 V9.5 C5 6.3 7.3 4 10.5 4 Z"
        fill="url(#isShield)"/>

  <!-- Calendar sheet with binder rings -->
  <rect x="22.8" y="10.6" width="4.4" height="8.6" rx="2.2" fill="#ffffff"/>
  <rect x="36.8" y="10.6" width="4.4" height="8.6" rx="2.2" fill="#ffffff"/>
  <rect x="16" y="15" width="32" height="24" rx="4" fill="#ffffff"/>
  <rect x="16" y="21.8" width="32" height="1.6" fill="#d9e8fb"/>

  <!-- Invigilators -->
  <g fill="#1a2b5c">
    <circle cx="22.5" cy="27" r="1.7"/><rect x="20.4" y="29" width="4.2" height="2.4" rx="1.2"/>
    <circle cx="32" cy="27" r="1.7"/><rect x="29.9" y="29" width="4.2" height="2.4" rx="1.2"/>
    <circle cx="41.5" cy="27" r="1.7"/><rect x="39.4" y="29" width="4.2" height="2.4" rx="1.2"/>
    <circle cx="22.5" cy="34" r="1.7"/><rect x="20.4" y="36" width="4.2" height="2.4" rx="1.2"/>
    <circle cx="41.5" cy="34" r="1.7"/><rect x="39.4" y="36" width="4.2" height="2.4" rx="1.2"/>
  </g>
  <!-- Highlighted invigilator -->
  <circle cx="32" cy="34" r="1.7" fill="#19a85b"/><rect x="29.9" y="36" width="4.2" height="2.4" rx="1.2" fill="#19a85b"/>

  <!-- Verified check sweeping beyond the shield -->
  <path d="M31 44 L39.5 51.5 L58.5 23.5" fill="none" stroke="#ffffff" stroke-width="10.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M31 44 L39.5 51.5 L58.5 23.5" fill="none" stroke="url(#isCheck)" stroke-width="6.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
