# Render Blueprint for the Invigismart Pro service.
#
#   Render dashboard -> New + -> Blueprint -> pick this repo -> Apply.
#
# This is a SINGLE-ORIGIN deploy: one container serves the static site
# (index.html, landing.html, terms/privacy, assets/) AND /api/* from the same
# hostname, so api-base.js stays '' and the domain needs no separate api. host.
# The click-path, DNS records and verification are in deploy/RENDER.md.
#
# Render builds ./Dockerfile, mounts the disk below at /data, and asks for every
# value marked `sync: false` (those are the secrets, which must never sit in
# git). Values marked `generateValue: true` are created once by Render.
#
# Two things about the plan choice:
#   * `starter` is the cheapest plan that allows a persistent disk. On the free
#     plan there is no disk, so the SQLite database resets on every deploy and
#     every sleep - paid licences would vanish. Do not run a paywall on free.
#   * Render sleeps a free instance after 15 minutes idle; the first request
#     then waits ~30s. PayFast's ITN is an unattended POST, so a sleeping
#     instance means a payment notification that is retried (PayFast does retry)
#     rather than applied immediately.
#
# Frankfurt is the closest Render region to South Africa (~180ms from Cape Town).
services:
  - type: web
    name: invigismart-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: invigismart-data
      mountPath: /data
      sizeGB: 1
    envVars:
      # --- shape of the process ---------------------------------------------
      # Bind every interface. Do NOT pin PORT here: Render injects PORT into the
      # container (default 10000) and its router forwards to exactly that port.
      # server/app.py and the Dockerfile HEALTHCHECK both read $PORT, so the app
      # and the probe always agree with Render. (The image's ENV PORT=8080 is
      # only the fallback for `docker run` outside Render.)
      - key: HOST
        value: 0.0.0.0
      # Database and uploaded PDFs, on the disk above (never in the image).
      - key: DB_PATH
        value: /data/invigismart.db
      - key: DOCUMENTS_DIR
        value: /data/documents

      # --- public URL --------------------------------------------------------
      # The ONE origin this service serves: the static site and /api/* both live
      # here. For the first deploy use the onrender.com hostname Render assigns
      # (https://invigismart-api.onrender.com). Once the custom domain in
      # deploy/RENDER.md is verified, change it to https://invigismart.online and
      # redeploy: this value builds the PayFast return/cancel URLs and the
      # recorded notify_url, so it must match what customers actually see.
      - key: APP_BASE_URL
        sync: false

      # --- sessions ----------------------------------------------------------
      # Generated once by Render. Rotating it signs every school out.
      - key: JWT_SECRET
        generateValue: true

      # --- billing -----------------------------------------------------------
      - key: BILLING_PROVIDER
        value: payfast
      - key: PAYFAST_MERCHANT_ID
        sync: false
      - key: PAYFAST_MERCHANT_KEY
        sync: false
      # Must match PayFast -> Settings -> Integration exactly, or every checkout
      # signature is rejected. Leave unset only if the account has no passphrase,
      # in which case also set PAYFAST_ALLOW_NO_PASSPHRASE=1.
      - key: PAYFAST_PASSPHRASE
        sync: false
      # Real money once this is 0. Keep 1 until a full sandbox purchase works.
      - key: PAYFAST_SANDBOX
        value: "1"
      - key: PAYFAST_FREQUENCY
        value: "6"
      - key: PAYFAST_CYCLES
        value: "0"
      - key: PAYFAST_ITN_VERIFICATION
        value: api
      # Mock billing mints free licences; it is force-disabled on https anyway.
      - key: ALLOW_MOCK_BILLING
        value: "0"
      # First-deploy escape hatch. server/config.py REFUSES TO BOOT when
      # APP_BASE_URL is https and the gateway is not fully configured. Set this
      # to "1" ONLY to bring the site + app online before PayFast credentials
      # exist: the marketing pages, signup and the roster dashboard work, but
      # PAYMENTS ARE OFF. Flip it back to "0" the moment PAYFAST_MERCHANT_ID /
      # KEY / PASSPHRASE are entered, or a real payment cannot complete.
      - key: ALLOW_INSECURE_BILLING
        value: "0"

      # --- plan copy / support ----------------------------------------------
      - key: PLAN_NAME
        value: Annual School Unlimited
      - key: PLAN_PRICE_DISPLAY
        value: R1200 / year
      - key: PLAN_PRICE_AMOUNT
        value: "1200.00"
      - key: SUBSCRIPTION_DAYS
        value: "365"
      - key: SUPPORT_EMAIL
        value: daniel@invigismart.online
      - key: SUPPORT_PHONE
        value: "+27 76 319 3749"

      # --- owner report (optional) ------------------------------------------
      # GET /api/admin/overview lists every school, its licence state and last
      # activity. Off unless this is set, and a value shorter than 24 chars
      # counts as unset. Generate with:
      #   python3 -c "import secrets; print(secrets.token_urlsafe(32))"
      - key: ADMIN_TOKEN
        sync: false
